name: Extension CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  release-zip:
    # Package the MV3 extension as a ZIP and attach it to a GitHub Release on tags.
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Package extension ZIP
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          zip -r "dist/gamblock-ai-extension-v${VERSION}.zip" \
            manifest.json background.js content_script.js \
            options.html options.js README.md

      - name: Create GitHub Release and upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          name: Gamblock-AI Browser Extension ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/gamblock-ai-extension-*.zip
