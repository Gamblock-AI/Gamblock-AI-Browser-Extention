name: Extension CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify committed AI context
        run: bash scripts/verify-ai-context.sh
      - run: npm run validate:extension
      - run: npm test
      - run: npm run package:extension
      - run: npm run verify:package

  release-zip:
    # Package the MV3 extension as a ZIP and attach it to a GitHub Release on tags.
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package extension ZIP
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="dist/gamblock-ai-extension-v${VERSION}.zip"
          bash scripts/package-extension.sh "$ARCHIVE"
          bash scripts/verify-extension-package.sh "$ARCHIVE"

      - name: Create GitHub Release and upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          name: Gamblock-AI Browser Extension ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/gamblock-ai-extension-*.zip
